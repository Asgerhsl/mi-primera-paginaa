<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Prueba</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      background-color: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      max-width: 400px;
    }
    h1 {
      color: #38bdf8;
      margin-top: 0;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>¡Funciona correctamente! 🎉</h1>
    <p>Si puedes ver este mensaje, tu servidor web y el HTML están cargando sin problemas.</p>
    <button onclick="alert('¡El código JavaScript también funciona!')">Probar interactividad</button>
  </div>
</body>
</html>
